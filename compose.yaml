services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: dev-local
      POSTGRES_DB: curriculo
    volumes:
      - bot_db:/var/lib/postgresql/data
  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-disable-javascript=true"]
volumes:
  n8n_data:
  bot_db: